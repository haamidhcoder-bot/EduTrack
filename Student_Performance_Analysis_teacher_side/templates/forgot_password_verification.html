<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
</head>
<body>
    <div class="login-wrapper">
        <div class="login-box">
            <h1>Reset Password</h1>
          <form method="POST" action="/forgot_password_verification/{{username}}/{{password}}">
            <input type="password" name="onepass" placeholder="Enter the OTP" required >
            <button type="submit" class="login-btn">Update Password</button>
          </form>
          <div class="register-line"><br>
            <a href="{{ url_for('auth.login_page') }}">Back to Login</a>
        </div>
      </div>
</body>
</html>
