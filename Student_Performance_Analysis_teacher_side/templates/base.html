<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        nav.dock-nav {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #12181f;
            padding: 12px 32px;
            border-radius: 46px;
            list-style: none;
        }

        nav.dock-nav .dock-item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            color: #9aa5b1;
            text-decoration: none;
            transition: transform .25s ease, background-color .25s ease,
                        color .25s ease, box-shadow .25s ease;
        }

        nav.dock-nav .dock-item i {
            font-size: 19px;
            transition: font-size .25s ease;
        }

        nav.dock-nav .dock-label {
            position: absolute;
            top: 100%;
            margin-top: 8px;
            font-size: 11px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            opacity: 0;
            transform: translateY(-4px);
            transition: opacity .25s ease, transform .25s ease;
            pointer-events: none;
        }

        nav.dock-nav .dock-item:hover,
        nav.dock-nav .dock-item.active {
            transform: translateY(-16px);
            background: #1565A6;
            color: #fff;
            box-shadow: 0 10px 18px rgba(21, 101, 166, 0.45);
        }

        nav.dock-nav .dock-item:hover i,
        nav.dock-nav .dock-item.active i {
            font-size: 21px;
        }

        nav.dock-nav .dock-item:hover .dock-label,
        nav.dock-nav .dock-item.active .dock-label {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
    {%block head%}<!--jinga-->{%endblock%}
</head>
<body>
    <div class="navbar">
        <div class="brand">SCHOOL PERFORMANCE ANALYSIS</div>
  
        <nav class="dock-nav">
            <a href="/home" class="dock-item {% if request.path=='/home'or request.path=='/show_results' or request.path=='/' %}active{% endif %}">
                <i class="fa-solid fa-house"></i>
                <span class="dock-label">Home</span>
            </a>
  
            <a href="/leaderboard" class="dock-item {% if request.path=='/leaderboard' %}active{% endif %}">
                <i class="fa-solid fa-trophy"></i>
                <span class="dock-label">Leaderboard</span>
            </a>

            <a href="/attendence" class="dock-item {% if request.path=='/attendence' %}active{% endif %}">
                <i class="fa-solid fa-calendar-check"></i>
                <span class="dock-label">Attendance</span>
            </a>
            
            <a href="/about" class="dock-item {% if request.path=='/about' %}active{% endif %}">
                <i class="fa-solid fa-circle-info"></i>
                <span class="dock-label">About Us</span>
            </a>
            
            <a href="/profile" class="dock-item {% if request.path=='/profile' %}active{% endif %}">
                <i class="fa-solid fa-circle-user"></i>
                <span class="dock-label">Profile</span>
            </a>

        </nav>
    </div>
    {%block body%}{%endblock%}
</body>
</html>
