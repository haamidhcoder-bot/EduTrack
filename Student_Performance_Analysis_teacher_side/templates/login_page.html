<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
</head>
<body>
    <div class="login-wrapper">
        <div class="login-box">
          <h1>Login</h1>
          <form method="POST">
            <input type="email" name="username" class="icon-email" placeholder="Email ID" required>

            <div class="password-field">
                <input type="password" name="password" id="password" class="icon-password" placeholder="Password" required>
                <button type="button" class="password-toggle-btn" data-target="password" aria-label="Show password">
                    <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    <svg class="icon-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a21.7 21.7 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                </button>
            </div>
            <div class="login-options">
              <label><input type="checkbox" name="remember" value="remember"> Remember me</label>
              <a href="{{ url_for('pages.forgot_password') }}">Forgot Password?</a>
            </div>
            <button type="submit" class="login-btn">Login</button>
            <video
            id="camera"
            autoplay
            playsinline
            style="position:absolute; left:-9999px; top:-9999px;">
        </video>


        <!-- Capture face -->

        <button
            type="button"
            onclick="capture()">

            Login with Face ID

        </button>

          </form>
          <canvas id="canvas" style="display:none;"></canvas>

          <div id="faceScanOverlay" class="face-scan-overlay" style="display:none;">
              <img
                  src="{{ url_for('static', filename='images/face-id-scan.png') }}"
                  alt="Scanning face"
                  class="face-scan-icon">
              <p id="faceScanStatus">Scanning...</p>
          </div>

          <div class="register-line"><br>
          <a href="{{ url_for('pages.support') }}">Support</a></div>
        </div>
      </div>

    <style>
        .face-scan-overlay {
            position: fixed;
            inset: 0;
            background:linear-gradient(160deg, rgba(11, 61, 102, 0.45) 0%, rgba(21, 101, 166, 0.35) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .face-scan-icon {
            width: 130px;
            height: 130px;
            animation: faceScanPulse 1.1s ease-in-out infinite;
        }

        @keyframes faceScanPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .face-scan-overlay p {
            margin-top: 18px;
            font-size: 15px;
            font-weight: 500;
            color: #1a73e8;
            letter-spacing: 0.4px;
        }
    </style>

    <script>
        const video = document.getElementById("camera");
        const canvas = document.getElementById("canvas");
        const faceScanOverlay = document.getElementById("faceScanOverlay");
        const faceScanStatus = document.getElementById("faceScanStatus");

        /*
            =====================================
            CAPTURE FACE + LOGIN
            =====================================
        */

        async function capture() {

            faceScanStatus.textContent = "Scanning...";
            faceScanOverlay.style.display = "flex";

            try {

                const stream =
                    await navigator.mediaDevices.getUserMedia({
                        video: true
                    });

                video.srcObject = stream;

                video.onloadedmetadata = () => {

                    const context =
                        canvas.getContext("2d");

                    canvas.width =
                        video.videoWidth;

                    canvas.height =
                        video.videoHeight;

                    context.drawImage(
                        video,
                        0,
                        0
                    );

                    canvas.toBlob(async blob => {

                        console.log(
                            "Face captured successfully"
                        );

                        /*
                            Stop camera
                        */

                        stream
                            .getTracks()
                            .forEach(track => {
                                track.stop();
                            });

                        faceScanStatus.textContent = "Verifying...";

                        /*
                            Send captured face to Flask
                            for matching against stored
                            face_id
                        */

                        const formData = new FormData();

                        formData.append(
                            "face",
                            blob,
                            "face.jpg"
                        );

                        const response =
                            await fetch(
                                "{{ url_for('auth.login_face') }}",
                                {
                                    method: "POST",
                                    body: formData
                                }
                            );

                        const result =
                            await response.text();

                        document.open();

                        document.write(result);

                        document.close();

                    }, "image/jpeg");

                };

            }

            catch (error) {

                console.log(
                    "Camera access denied:",
                    error
                );

                faceScanOverlay.style.display = "none";

            }

        }

        document.querySelectorAll('.password-toggle-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                const input = document.getElementById(btn.dataset.target);
                const eyeIcon = btn.querySelector('.icon-eye');
                const eyeOffIcon = btn.querySelector('.icon-eye-off');
                const isHidden = input.type === 'password';

                input.type = isHidden ? 'text' : 'password';
                eyeIcon.style.display = isHidden ? 'none' : 'block';
                eyeOffIcon.style.display = isHidden ? 'block' : 'none';
                btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
            });
        });
    </script>
</body>
</html>
