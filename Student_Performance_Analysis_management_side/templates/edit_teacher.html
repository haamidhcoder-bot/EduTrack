<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="card edit-form">
            <h2>Edit details</h2>
            <p style="color: var(--text-muted); margin-top: -8px;">
                {{teacher.gmail}} 
            </p>
            <form action="/edit_teacher/{{teacher.Gmail}}" method="POST">
                <input type="password" name="password" class="icon-password" placeholder="New Password" required>
                <input type="password" name="confirm_password" class="icon-password" placeholder="Confirm Password" required>
                <button type="submit" style="width:100%;">Update</button>
            </form>
        </div>
    </div>
</body>
</html>
