<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Teacher</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <div class="card edit-form">

        <h2>Add Teacher</h2>

        <form id="teacherForm"
              action="{{ url_for('pages.add_teacher') }}"
              method="POST">

            <input
                type="email"
                name="username"
                class="icon-email"
                placeholder="Email ID"
                required>


            <div class="password-field">

                <input
                    type="password"
                    name="password"
                    id="password"
                    class="icon-password"
                    placeholder="Password"
                    required>

                <button
                    type="button"
                    class="password-toggle-btn"
                    data-target="password"
                    aria-label="Show password">

                    <svg class="icon-eye"
                         viewBox="0 0 24 24"
                         width="18"
                         height="18"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>

                        <circle cx="12" cy="12" r="3"></circle>

                    </svg>

                    <svg class="icon-eye-off"
                         viewBox="0 0 24 24"
                         width="18"
                         height="18"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round"
                         style="display:none;">

                        <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a21.7 21.7 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>

                        <line x1="1" y1="1" x2="23" y2="23"></line>

                    </svg>

                </button>

            </div>


            <div class="password-field">

                <input
                    type="password"
                    name="confirm_password"
                    id="confirm_password"
                    class="icon-password"
                    placeholder="Confirm Password"
                    required>

                <button
                    type="button"
                    class="password-toggle-btn"
                    data-target="confirm_password"
                    aria-label="Show password">

                    <svg class="icon-eye"
                         viewBox="0 0 24 24"
                         width="18"
                         height="18"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round">

                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>

                        <circle cx="12" cy="12" r="3"></circle>

                    </svg>

                    <svg class="icon-eye-off"
                         viewBox="0 0 24 24"
                         width="18"
                         height="18"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         stroke-linecap="round"
                         stroke-linejoin="round"
                         style="display:none;">

                        <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a21.7 21.7 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>

                        <line x1="1" y1="1" x2="23" y2="23"></line>

                    </svg>

                </button>

            </div>


            <input
                type="number"
                name="class_teacher"
                placeholder="Enter the class for the teacher"
                required>


            <select name="class_teacher_sec" id="sec" required>

                <option value="">
                    Select Section
                </option>

                <option value="A"
                    {% if sec == "A" %}selected{% endif %}>
                    A
                </option>

                <option value="B"
                    {% if sec == "B" %}selected{% endif %}>
                    B
                </option>

                <option value="C"
                    {% if sec == "C" %}selected{% endif %}>
                    C
                </option>

            </select>


            <!-- Camera -->

            <video
                id="camera"
                autoplay
                playsinline
                style="position:absolute; left:-9999px; top:-9999px;">
            </video>


            <!-- Capture face -->

            <button
                type="button"
                onclick="capture()">

                Add Login Face ID

            </button>


            <!-- Submit teacher -->

            <button
                type="submit"
                class="login-btn">

                Add Teacher

            </button>

        </form>


        <canvas
            id="canvas"
            style="display:none;">
        </canvas>

        <div id="faceScanOverlay" class="face-scan-overlay" style="display:none;">
            <img
                src="{{ url_for('static', filename='images/face-id-scan.png') }}"
                alt="Scanning face"
                class="face-scan-icon">
            <p id="faceScanStatus">Scanning...</p>
        </div>

    </div>

</div>


<style>
    .face-scan-overlay {
        position: fixed;
        inset: 0;
        background: rgba(255, 255, 255, 0.97);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
    }

    .face-scan-icon {
        width: 130px;
        height: 130px;
        animation: faceScanPulse 1.1s ease-in-out infinite;
    }

    @keyframes faceScanPulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.1); opacity: 1; }
    }

    .face-scan-overlay p {
        margin-top: 18px;
        font-size: 15px;
        font-weight: 500;
        color: #1a73e8;
        letter-spacing: 0.4px;
    }
</style>

<script>

const video = document.getElementById("camera");

const form = document.getElementById("teacherForm");

const faceScanOverlay = document.getElementById("faceScanOverlay");

const faceScanStatus = document.getElementById("faceScanStatus");

let faceBlob = null;


/*
    =====================================
    CAPTURE FACE
    =====================================
*/

async function capture() {

    faceScanStatus.textContent = "Scanning...";

    faceScanOverlay.style.display = "flex";

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                video: true
            });


        video.srcObject = stream;


        video.onloadedmetadata = () => {

            const canvas =
                document.getElementById("canvas");

            const context =
                canvas.getContext("2d");


            canvas.width =
                video.videoWidth;

            canvas.height =
                video.videoHeight;


            /*
                Take current video frame
                and put it onto canvas
            */

            context.drawImage(
                video,
                0,
                0
            );


            /*
                Convert canvas to JPEG
            */

            canvas.toBlob(blob => {

                faceBlob = blob;

                console.log(
                    "Face captured successfully"
                );


                /*
                    Stop camera
                */

                stream
                    .getTracks()
                    .forEach(track => {
                        track.stop();
                    });


                faceScanStatus.textContent = "Face captured!";

                setTimeout(() => {
                    faceScanOverlay.style.display = "none";
                }, 700);


            }, "image/jpeg");

        };

    }

    catch (error) {

        console.log(
            "Camera access denied:",
            error
        );

        faceScanOverlay.style.display = "none";

    }

}


/*
    =====================================
    ADD TEACHER
    =====================================
*/

form.addEventListener(
    "submit",
    async function(event) {

        /*
            Prevent normal browser
            form submission
        */

        event.preventDefault();


        /*
            Make sure face was captured
        */

        if (!faceBlob) {

            alert(
                "Please click 'Add Login Face ID' first."
            );

            return;
        }


        /*
            Collect all form fields
        */

        const formData =
            new FormData(form);


        /*
            Add captured face
        */

        formData.append(
            "face",
            faceBlob,
            "face.jpg"
        );


        /*
            NOW send everything to Flask
        */

        const response =
            await fetch(
                "{{ url_for('pages.add_teacher') }}",
                {
                    method: "POST",
                    body: formData
                }
            );


        /*
            Get Flask response
        */

        const result =
            await response.text();


        /*
            Display Flask response
        */

        document.open();

        document.write(result);

        document.close();

    }
);


/*
    =====================================
    PASSWORD SHOW/HIDE
    =====================================
*/

document
    .querySelectorAll(".password-toggle-btn")
    .forEach(function(btn) {

        btn.addEventListener(
            "click",
            function() {

                const input =
                    document.getElementById(
                        btn.dataset.target
                    );

                const eyeIcon =
                    btn.querySelector(
                        ".icon-eye"
                    );

                const eyeOffIcon =
                    btn.querySelector(
                        ".icon-eye-off"
                    );

                const isHidden =
                    input.type === "password";


                input.type =
                    isHidden
                    ? "text"
                    : "password";


                eyeIcon.style.display =
                    isHidden
                    ? "none"
                    : "block";


                eyeOffIcon.style.display =
                    isHidden
                    ? "block"
                    : "none";


                btn.setAttribute(
                    "aria-label",
                    isHidden
                    ? "Hide password"
                    : "Show password"
                );

            }
        );

    });

</script>

</body>
</html>
